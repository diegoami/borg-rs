name: release
# Manual only: build, check and publish the downloadable assets for an
# existing release tag. Notes come from docs/releases/<tag>.md on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. 4.2.6-impact-v15'
        required: true
        type: string
      base:
        description: 'Full Borg-rs commit SHA the release patch applies to'
        required: true
        type: string
      title:
        description: 'Release title (default: borg-rs <tag>)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      BASE: ${{ inputs.base }}
      TITLE: ${{ inputs.title }}
      DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ github.token }}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxext-dev xvfb xfonts-base
      - name: Check the tag, the notes and that no release exists yet
        run: |
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          git fetch --no-tags origin main
          git show "origin/main:docs/releases/$TAG.md" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; not overwriting" >&2
            exit 1
          fi
      - name: Package source and verify the release patch
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          target=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$BASE" "$target"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out" "$RUNNER_TEMP/src"
          prefix="borg-rs-$TAG-src"
          git archive --prefix="$prefix/" "$target" | gzip -n > "$out/$prefix.tar.gz"
          git diff --binary --full-index "$BASE" "$target" > "$out/borg-rs-$TAG.patch"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git -C "$RUNNER_TEMP/base" apply --index "$out/borg-rs-$TAG.patch"
          test "$(git -C "$RUNNER_TEMP/base" write-tree)" = "$(git rev-parse "$target^{tree}")"
          tar xzf "$out/$prefix.tar.gz" -C "$RUNNER_TEMP/src"
      - name: Check the source asset and build the Rust Linux binary
        run: |
          cd "$RUNNER_TEMP/src/borg-rs-$TAG-src"
          cargo test --release --locked
          cmake -S angband -B build -DSUPPORT_BORG=ON -DBORG_IMPL=c -DSUPPORT_TEST_FRONTEND=ON -DSUPPORT_X11_FRONTEND=ON
          cmake --build build --parallel 4
          cmake --build build --target alltests --parallel 4 2>&1 | tee "$RUNNER_TEMP/alltests.log"
          python3 - "$RUNNER_TEMP/alltests.log" <<'EOF'
          import re, sys
          text = re.sub(r'\x1b\[[0-9;]*m', '', open(sys.argv[1]).read())
          totals = [(int(a), int(b)) for a, b in re.findall(r'^Total:[ \t]+(\d+)/(\d+)', text, re.M)]
          print('totals', totals)
          assert len(totals) == 2 and all(p == n for p, n in totals), totals
          assert totals[0][1] >= 965 and totals[1][1] >= 5, totals
          EOF
          cmake -S angband -B build-rust -DCMAKE_BUILD_TYPE=Release -DBORG_IMPL=rust \
            -DSUPPORT_X11_FRONTEND=ON -DSUPPORT_TEST_FRONTEND=ON -DSUPPORT_BORG_RECORDING=ON -DSC_INSTALL=ON
          cmake --build build-rust --target OurExecutable TransferLib --parallel 4
          package="borg-rs-$TAG-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/package/$package"
          cp -a build-rust/game/angband build-rust/game/lib "$RUNNER_TEMP/package/$package/"
          tar czf "$RUNNER_TEMP/out/$package.tar.gz" -C "$RUNNER_TEMP/package" "$package"
          cd "$RUNNER_TEMP/out"
          sha256sum ./*.tar.gz ./*.patch > SHA256SUMS
      - name: Check the Linux binary starts under Xvfb
        run: |
          mkdir "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/out/borg-rs-$TAG-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin/borg-rs-$TAG-linux-x86_64"
          set +e
          xvfb-run -a timeout 10 ./angband -mx11 -n > "$RUNNER_TEMP/smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          # 124: still running at the timeout, i.e. it started and waited for input.
          test "$rc" = 124
      - name: Add build facts to the notes
        run: |
          out="$RUNNER_TEMP/out"
          glibc=$(objdump -T "$RUNNER_TEMP/package/borg-rs-$TAG-linux-x86_64/angband" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          {
            echo
            echo "## Build facts"
            echo
            echo "- Built by the \`release\` workflow, run ${GITHUB_RUN_ID}, on \`$(lsb_release -ds)\`, from tag \`$TAG\` (commit \`$(git rev-parse "$TAG^{commit}")\`)."
            echo "- The Linux binary needs ${glibc#GLIBC_} or newer (glibc) and X11 bitmap fonts."
            echo "- Workflow checks: the patch reproduces the tag on its base; the source asset passes its unit and front-end tests; the binary starts under Xvfb."
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Keep the assets as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.patch
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/notes.md
      - name: Publish the release
        run: |
          out="$RUNNER_TEMP/out"
          title="${TITLE:-borg-rs $TAG}"
          draft=()
          if [ "$DRAFT" = "true" ]; then draft=(--draft); fi
          gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${draft[@]}" \
            "$out/borg-rs-$TAG-linux-x86_64.tar.gz" \
            "$out/borg-rs-$TAG-src.tar.gz" \
            "$out/borg-rs-$TAG.patch" \
            "$out/SHA256SUMS"
