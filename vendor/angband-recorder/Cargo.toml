[package]
name = "angband-recorder"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "External-input recording and verified replay for Angband"
repository = "https://github.com/diegoami/angband-recorder"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
ffi = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
