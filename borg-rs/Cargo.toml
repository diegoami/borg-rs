[package]
name = "borg-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Rust port of the Angband Borg (automatic player)"
publish = false

[lib]
name = "borg_rs"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
recording = ["dep:angband-recorder"]
# Test only (harness/regress/nested): every 500th think step shows two long
# messages, so the engine waits for a key and runs a nested Borg turn.
# Changes the key stream; never part of a real build.
test-force-nested = []

[dependencies]
libc = "0.2"

angband-recorder = { path = "../vendor/angband-recorder", optional = true, features = ["ffi"] }
